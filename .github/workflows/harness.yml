name: Harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cage:
    name: eval-cage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run eval cage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_harness.py \
            tests/test_harness_mcp.py \
            tests/test_harness_policies.py \
            tests/test_control_plane.py \
            tests/test_graph_pipeline.py \
            tests/test_checklist.py \
            tests/test_intake_office.py
