# Pure LangGraph runtime (Part B) — switch path without code changes.
# Paths: part_a_adk | part_b_langgraph | part_c_hybrid

path: part_b_langgraph

hitl:
  enabled: true
  interrupt_before: freeze_package
  resume_roles: [PI, "Office of Research Aid", Admin]
  decisions: [approve, revise, waive]

agents:
  knowledge_updater: {enabled: true}
  writer: {enabled: true}
  reviewer: {enabled: true}
  compliance: {enabled: true}
  budget_scrutinizer: {enabled: true}
  missing_essentials: {enabled: true}   # checklist agent
  package_creator: {enabled: true}
  submission_assistant: {enabled: false}  # Office of Research Aid only; never autonomous

checklist:
  catalog: config/checklists/r01_essentials.yaml
  mechanism: R01

observability:
  audit_log: output/audit_log.jsonl
  # Langfuse: set LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY (see docs/observability.md)
  langfuse: env

control_plane:
  guard: true
  pi_cannot_submit: true
