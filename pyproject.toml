[project]
name = "grant-agent-lab"
version = "0.1.0"
description = "Multi-agent NIH grant proposal system – ADK, LangGraph, and Hybrid paths under an AGT-style control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "typing-extensions>=4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
adk = ["google-adk>=2.0"]
observability = ["langfuse>=2.0", "opentelemetry-api", "opentelemetry-sdk"]
redteam = ["deepteam"]
vertex = ["google-genai", "google-auth"]
desktop = ["pywebview>=5.0"]
dev = ["pytest", "ruff"]

[project.scripts]
grant-harness = "src.harness.cli:main"
grant-desktop = "src.desktop.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
