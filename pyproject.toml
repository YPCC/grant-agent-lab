[project]
name = "grant-agent-lab"
version = "0.1.0"
description = "Multi-agent NIH grant proposal system – ADK, LangGraph, and Hybrid paths under an AGT-style control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "typing-extensions>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
adk = ["google-adk>=2.0"]
observability = ["langfuse>=2.0", "opentelemetry-api", "opentelemetry-sdk"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
